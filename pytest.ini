[pytest]
# Menentukan folder utama tempat file-file test berada
testpaths = tests

# Menjalankan pytest-html dan pytest-html-reporter secara bersamaan ke folder reports
addopts = --html=reports/report.html --self-contained-html --html-report=reports/dashboard_report.html -v

# Mengaktifkan log di terminal secara langsung (live logging)
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Menyembunyikan pesan warning yang mengganggu (seperti DeprecationWarning pada report.extras)
filterwarnings = 
    ignore::DeprecationWarning